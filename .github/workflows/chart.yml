name: chart

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/chart.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Lives on its own branch so the bot never shows on main or in Contributors.
      - name: Publish to the output branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir output && mv chart.svg output/ && cd output
          git init -q -b output
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chart.svg
          git commit -q -m 'Update chart'
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
